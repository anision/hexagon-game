services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hexagon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hexagon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports exposed — only reachable by backend inside Docker network

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # ALLOWED_ORIGIN must be set to your public URL in .env (e.g. http://SEU_IP)
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app
               --workers 2
               --worker-class uvicorn.workers.UvicornWorker
               --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    # No ports exposed — only reachable by nginx inside Docker network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
