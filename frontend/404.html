<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexagon — Página não encontrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      text-align: center;
    }
    .not-found-code {
      font-size: 5rem;
      font-weight: 700;
      color: #4361ee;
      line-height: 1;
    }
    .not-found-msg {
      font-size: 1.2rem;
      color: #94a3b8;
    }
    .not-found-link {
      color: #4361ee;
      font-size: 0.95rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .not-found-link:hover { color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="not-found-code">404</div>
    <h1 class="game-title">Hexagon</h1>
    <p class="not-found-msg">Página não encontrada.</p>
    <a class="not-found-link" href="/">Voltar ao início</a>
  </div>
</body>
</html>
