<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexagon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Header ── -->
    <header id="game-header">
      <h1 class="game-title">Hexagon</h1>
    </header>

    <!-- ── Game area ── -->
    <main id="game-main">

      <!-- Sidebar: turn + score -->
      <aside id="game-sidebar">
        <div id="turn-indicator" data-player="1">Vez do Jogador 1</div>

        <div class="scoreboard">
          <div class="score-block" data-player="1">
            <span class="score-label">Jogador 1</span>
            <span class="score-value" id="score-p1">3</span>
          </div>
          <div class="score-separator">×</div>
          <div class="score-block" data-player="2">
            <span class="score-label">Jogador 2</span>
            <span class="score-value" id="score-p2">3</span>
          </div>
        </div>
      </aside>

      <!-- Canvas -->
      <canvas id="game-canvas">
        Seu browser não suporta Canvas. Atualize para jogar.
      </canvas>

    </main>

    <!-- ── Game-over overlay ── -->
    <div id="game-overlay" class="hidden">
      <div id="overlay-content">
        <p id="overlay-message">Fim de jogo!</p>
        <p id="overlay-score"></p>
        <button id="btn-restart">Jogar novamente</button>
      </div>
    </div>

  </div>

  <script src="js/auth.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
