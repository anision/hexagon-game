<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexagon — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
    }
    .login-title {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #e2e8f0;
    }
    .login-subtitle {
      font-size: 1rem;
      color: #94a3b8;
    }
    .btn-google {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      color: #1a1a2e;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-google:hover { opacity: 0.9; }
    .btn-google svg { width: 20px; height: 20px; }
    .error-msg {
      color: #e63946;
      font-size: 0.9rem;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="login-title">Hexagon</h1>
    <p class="login-subtitle">Jogue contra um amigo ou contra o computador</p>

    <p id="error-msg" class="error-msg">Login cancelado. Tente novamente.</p>

    <a id="btn-google" class="btn-google" href="/auth/google">
      <!-- Google logo SVG -->
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Entrar com Google
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'login_cancelled') {
      document.getElementById('error-msg').classList.add('visible');
    }

    // Redirect to backend auth URL (configurable via meta tag or env)
    const backendUrl = window.BACKEND_URL || 'http://localhost:8000';
    document.getElementById('btn-google').href = `${backendUrl}/auth/google`;
  </script>
</body>
</html>
